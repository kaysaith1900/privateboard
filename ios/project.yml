# XcodeGen project definition · run `xcodegen generate` in this folder to
# produce Boardroom.xcodeproj, then open it in Xcode. Keeping the project as
# YAML avoids hand-merging the pbxproj and keeps the source tree the source of
# truth (every .swift under Boardroom/ is picked up automatically).
name: Boardroom
options:
  bundleIdPrefix: ai.boardroom
  deploymentTarget:
    iOS: "26.0"   # native Liquid Glass (.glassEffect / GlassEffectContainer)
  createIntermediateGroups: true

packages:
  BoardroomKit:
    path: BoardroomKit
  Swifter:
    url: https://github.com/httpswift/swifter.git
    from: 1.5.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "13"
    DEVELOPMENT_TEAM: "MC8P34EHRC"   # Apple Developer team (kaiwen shi) · device + App Store signing

targets:
  Boardroom:
    type: application
    platform: iOS
    sources:
      - path: Boardroom
        excludes:
          - "Resources/web/**"
      # On-device 3D stage assets · bundled as a folder reference (preserves the
      # web/mobile, web/vendor, web/avatars/models structure) so the loopback
      # server serves them with intact paths. Populated by copy-ios-web-assets.sh.
      - path: Boardroom/Resources/web
        type: folder
        buildPhase: resources
    dependencies:
      - package: Swifter
        product: Swifter
      - package: BoardroomKit
        product: BoardroomCore
      - package: BoardroomKit
        product: BoardroomEngine
      - package: BoardroomKit
        product: BoardroomStorage
      - package: BoardroomKit
        product: BoardroomAI
      - package: BoardroomKit
        product: BoardroomVoice
      - package: BoardroomKit
        product: BoardroomSearch
      - package: BoardroomKit
        product: BoardroomSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.boardroom.mobile
        TARGETED_DEVICE_FAMILY: "1"            # iPhone only for now
        CODE_SIGN_STYLE: Automatic             # Xcode manages certs/profiles once DEVELOPMENT_TEAM is set
        # iCloud Documents · CloudDocuments service + ubiquity container
        # iCloud.ai.boardroom.mobile (BoardroomSync's iCloud Drive oplog). Automatic
        # signing + -allowProvisioningUpdates registers the capability/container.
        CODE_SIGN_ENTITLEMENTS: Boardroom/Support/Boardroom.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Boardroom/Resources/Assets.xcassets/AppIcon.appiconset (regen: scripts/build-ios-app-icon.mjs)
    info:
      path: Boardroom/Support/Info.generated.plist
      properties:
        CFBundleDisplayName: Private Board
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # No non-exempt encryption (HTTPS / system crypto only) · skips the
        # per-upload export-compliance prompt in App Store Connect / TestFlight.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Reach the desktop backend over the LAN (http://<mac-ip>:3030).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # iOS 14+ prompts before a LAN connection · this is the rationale shown.
        NSLocalNetworkUsageDescription: "Connect to the Boardroom server running on your computer over your local network."
        # Voice cloning records a short sample with the microphone.
        NSMicrophoneUsageDescription: "Record a short voice sample to clone a director's speaking voice."
        # Keep TTS playing when the screen locks (Phase 2 audio engine).
        UIBackgroundModes:
          - audio
